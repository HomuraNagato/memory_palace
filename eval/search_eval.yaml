  - id: textbook_clrs_loop_correctness
    difficulty: medium
    category: textbook
    query: "What three obligations establish that a loop's claimed property proves an algorithm correct?"
    expected:
      evidence:
        - source:
            relative_path: "textbooks/Algorithms/introduction_to_algorithms_3rd_edition.pdf"
            title: "introduction_to_algorithms_3rd_edition.pdf"
          all_of: ["Initialization: It is true prior to the", "Maintenance: If it is true before an iteration", "Termination: When the loop terminates"]
      answer:
        all_of: ["Initialization", "Maintenance", "Termination"]

  - id: textbook_billingsley_chapter_one_scope
    difficulty: hard
    category: textbook_structure
    query: "What major probabilistic subjects does the first chapter of Billingsley's text develop before general measure and integration?"
    expected:
      evidence:
        - source:
            relative_path: "textbooks/Probability and Stochastics/Billingsley Probability Sunhwa Recomended/Billingsley - Probability and Measure.pdf"
            title: "Billingsley - Probability and Measure.pdf"
          all_of: ["laws of large numbers", "Markov chains", "large deviations"]
      answer:
        all_of: ["laws of large numbers", "Markov chains", "large deviations"]

  - id: textbook_upfal_chapter_one_problem
    difficulty: hard
    category: textbook_structure
    query: "What is a problem in ch 1 of Upfal's probability textbook?"
    expected:
      evidence:
        - source:
            relative_path: "textbooks/Probability and Stochastics/Upfal Probability and Computing/Probability-and-Computing-2nd-Edition_Upfal.pdf"
            title: "Probability-and-Computing-2nd-Edition_Upfal.pdf"
          any_of:
            - "We flip a fair coin ten times"
            - "We roll two standard six-sided dice"
            - "The following problem is known as the Monty Hall problem"
      answer:
        any_of: ["fair coin", "six-sided dice", "Monty Hall"]

  - id: textbook_strang_column_and_null_spaces
    difficulty: hard
    category: textbook_concept
    query: "Contrast the vectors represented by a matrix's column space with those represented by its nullspace."
    expected:
      evidence:
        - source:
            relative_path: "textbooks/Linear Algebra/Strang linear algebra/Linear Algebra and its applications fourth edition Strang.pdf"
            title: "Linear Algebra and its applications fourth edition Strang.pdf"
          any_of: ["The column space contains all linear combinations of the columns of A"]
        - source:
            relative_path: "textbooks/Linear Algebra/Strang linear algebra/Linear Algebra and its applications fourth edition Strang.pdf"
            title: "Linear Algebra and its applications fourth edition Strang.pdf"
          any_of: ["The nullspace of a matrix consists of all vectors x such that Ax = 0"]
      answer:
        all_of: ["linear combinations", "Ax = 0"]

  - id: textbook_random_walk_wait
    difficulty: medium
    category: textbook_concept
    query: "In the random-walk example about Peter taking the lead, how does the expected waiting time differ between a favorable game and a fair game?"
    expected:
      evidence:
        - source:
            relative_path: "textbooks/Probability and Stochastics/Snell Probability/Dartmouth Probability Textbook.pdf"
            title: "Dartmouth Probability Textbook.pdf"
          all_of: ["1/(p − q), if p > q", "if p = q"]
      answer:
        any_of: ["1/(p", "infinite", "infinity"]

  - id: synthesis_sherlock_clues_and_cause
    difficulty: hard
    category: multi_evidence
    query: "Which apparently minor objects reveal the murder method in the Stoner case, and what ultimately kills the person who arranged it?"
    expected:
      evidence:
        - source:
            relative_path: "books/arthur_conan_doyle/the_adventures_of_sherlock_holmes/the_adventures_of_sherlock_holmes-arthur_conan_doyle.epub"
            title: "The Adventures of Sherlock Holmes"
          all_of: ["the saucer of milk", "the loop of whipcord"]
        - source:
            relative_path: "books/arthur_conan_doyle/the_adventures_of_sherlock_holmes/the_adventures_of_sherlock_holmes-arthur_conan_doyle.epub"
            title: "The Adventures of Sherlock Holmes"
          any_of: ["It is a swamp adder!"]
      answer:
        all_of: ["milk", "whipcord", "swamp adder"]

  - id: synthesis_hyperion_cruciform
    difficulty: hard
    category: multi_evidence
    query: "What claim do the Bikura make about people bearing the cross-shaped parasite, and how does it respond when an injury remains severely painful?"
    expected:
      evidence:
        - source:
            relative_path: "books/dan_simmons/hyperion_cantos/01-hyperion/hyperion-dan_simmons.epub"
            title: "Hyperion"
          any_of: ["You cannot die because you belong to the cruciform"]
        - source:
            relative_path: "books/dan_simmons/hyperion_cantos/01-hyperion/hyperion-dan_simmons.epub"
            title: "Hyperion"
          any_of: ["It was easier for the cruciform to resurrect his corpse than to tolerate such pain"]
      answer:
        all_of: ["cannot die", "resurrect"]

  - id: synthesis_uprooted_selection_and_resentment
    difficulty: hard
    category: multi_evidence
    query: "Who is expected to be taken from the village, and how does that expectation shape Agnieszka's feelings toward the Dragon?"
    expected:
      evidence:
        - source:
            relative_path: "books/naomi_novik/uprooted/uprooted-naomi_novik.epub"
            title: "Uprooted"
          any_of: ["we all knew he would take Kasia"]
        - source:
            relative_path: "books/naomi_novik/uprooted/uprooted-naomi_novik.epub"
            title: "Uprooted"
          any_of: ["he was going to take Kasia away, so I hated him"]
      answer:
        all_of: ["Kasia", "hate"]

  - id: unanswerable_holmes_mars_visit
    difficulty: hard
    category: unanswerable
    query: "In what year did Sherlock Holmes first investigate a crime on Mars?"
    expected:
      unanswerable: true
      answer:
        any_of: ["not in", "does not", "couldn't find", "could not find", "no evidence"]

  - id: unanswerable_billingsley_image_network
    difficulty: hard
    category: unanswerable
    query: "Which neural-network architecture does Billingsley recommend for classifying photographs?"
    expected:
      unanswerable: true
      answer:
        any_of: ["not in", "does not", "couldn't find", "could not find", "no evidence"]

  - id: unanswerable_queens_narrator_time
    difficulty: hard
    category: unanswerable
    query: "What was my own finish time at the Queens 10K?"
    expected:
      unanswerable: true
      answer:
        any_of: ["not provided", "not recorded", "doesn't say", "does not say", "does not contain", "cannot be determined", "couldn't find", "could not find"]
