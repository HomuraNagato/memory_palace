version: 3
name: memory-palace-retrieval
description: >
  Mixed-corpus retrieval and answer evaluation. Evidence anchors identify
  answer-bearing passages without relying on generated chunk IDs. Private
  holdout questions are supplied at runtime and do not belong in this file.

defaults:
  user_key: nagato
  mode: hybrid
  expected_top_k: 8

queries:
  - id: easy_usual_coffee_order
    difficulty: easy
    category: semantic
    query: "What is my usual Starbucks order?"
    expected:
      evidence:
        - source:
            relative_path: "cafes-shops/habitual food orders/starbucks.md"
            title: "starbucks.md"
          any_of: ["tall pistachio creme frappuchinno with soy milk"]
      answer:
        any_of: ["pistachio creme frapp", "pistachio crème frapp"]

  - id: easy_korean_wait_and_apologize
    difficulty: easy
    category: semantic
    query: "How do I ask someone to wait and then apologize in Korean?"
    expected:
      evidence:
        - source:
            relative_path: "languages/Korean/korean greetings.md"
            title: "korean greetings.md"
          all_of: ["잠시만주세요", "죄송합니다"]
      answer:
        all_of: ["잠시만", "죄송"]

  - id: easy_roommate_kitchen_question
    difficulty: easy
    category: semantic
    query: "What question did I save for discussing kitchen cleanliness with a potential roommate?"
    expected:
      evidence:
        - source:
            relative_path: "memory palace/roommate questions.md"
            title: "roommate questions.md"
          any_of: ["how clean are you in a kitchen?"]
      answer:
        any_of: ["how clean are you in a kitchen"]

  - id: easy_serene_present_ideas
    difficulty: easy
    category: semantic
    query: "What holiday present ideas did I record for Serene?"
    expected:
      evidence:
        - source:
            relative_path: "memory palace/Christmas presents.md"
            title: "Christmas presents.md"
          all_of: ["Disney ticket", "Pokemon z-a"]
      answer:
        all_of: ["Disney", "Pokemon"]

  - id: easy_scrooge_initial_character
    difficulty: easy
    category: semantic
    query: "How is Scrooge's withdrawn and ungenerous personality described near the beginning of the story?"
    expected:
      evidence:
        - source:
            relative_path: "books/charles_dickens/a_christmas_carol/a_christmas_carol-charles_dickens.epub"
            title: "A Christmas Carol"
          any_of: ["secret, and self-contained, and solitary as an oyster"]
      answer:
        any_of: ["solitary as an oyster", "self-contained"]

  - id: easy_sinegard_purpose
    difficulty: easy
    category: semantic
    query: "What kind of people is the empire's most prestigious academy intended to train?"
    expected:
      evidence:
        - source:
            relative_path: "books/r_f_kuang/the_poppy_war/01-the_poppy_war/the_poppy_war-r_f_kuang.epub"
            title: "The Poppy War"
          any_of: ["a training ground for future generals and statesmen"]
      answer:
        all_of: ["generals", "statesmen"]

  - id: medium_amazon_interview_support
    difficulty: medium
    category: relationship
    query: "Who helped Mark prepare effectively enough to secure the Amazon job?"
    expected:
      evidence:
        - source:
            relative_path: "diary/2024/10 October/2024.10.03 - Thursday.md"
            title: "2024.10.03 - Thursday.md"
          any_of: ["thanks to Lingyi’s really strict but important interview prep"]
      answer:
        any_of: ["Lingyi"]

  - id: medium_gangnam_dentist_referral
    difficulty: medium
    category: relationship
    query: "Who originally located the Korean dental office I later used for my broken filling?"
    expected:
      evidence:
        - source:
            relative_path: "diary/2023/11 November/2023.11.08 - Wednesday.md"
            title: "2023.11.08 - Wednesday.md"
          any_of: ["a place in Gangnam that Mark found"]
      answer:
        any_of: ["Mark"]

  - id: medium_social_bubble_observer
    difficulty: medium
    category: relationship
    query: "Who made me realize during the New Jersey trip that my knowledge of notable people was limited?"
    expected:
      evidence:
        - source:
            relative_path: "diary/2025/11 November/2025-Nov-02.md"
            title: "2025-Nov-02.md"
          any_of: ["she observed how much of a bubble I lived in"]
      answer:
        any_of: ["Serene"]

  - id: medium_ender_battleroom_orientation
    difficulty: medium
    category: concept
    query: "What mental reorientation does Ender teach his soldiers to use when entering the battleroom?"
    expected:
      evidence:
        - source:
            relative_path: "books/orson_scott_card/ender_saga/01-enders_game/enders_game-orson_scott_card.epub"
            title: "Ender’s Game"
          any_of: ["Whatever your gravity is when you get to the door, remember—the enemy’s gate is down"]
      answer:
        any_of: ["enemy’s gate is down", "enemy's gate is down"]

  - id: medium_gethenian_sexual_cycle
    difficulty: medium
    category: concept
    query: "How does reproductive sex change during the monthly cycle of people on Gethen?"
    expected:
      evidence:
        - source:
            relative_path: "books/ursula_k_le_guin/the_left_hand_of_darkness/the_left_hand_of_darkness-ursula_k_le_guin.epub"
            title: "The Left Hand of Darkness"
          all_of: ["two or three days of kemmer", "either male or female"]
      answer:
        all_of: ["kemmer", "male or female"]

  - id: medium_islr_model_selection
    difficulty: medium
    category: textbook
    query: "Which prediction error should determine the preferred statistical learning method, and why isn't performance on fitted observations enough?"
    expected:
      evidence:
        - source:
            relative_path: "textbooks/Probability and Stochastics/Intro to statistical learning/ISLR Sixth Printing.pdf"
            title: "ISLR Sixth Printing.pdf"
          all_of: ["previously unseen test observation", "lowest test MSE, as opposed to the lowest training MSE"]
      answer:
        all_of: ["test MSE", "unseen"]

  - id: medium_strang_rank_nullity
    difficulty: medium
    category: textbook
    query: "How do pivot variables and free variables account for all columns of a matrix?"
    expected:
      evidence:
        - source:
            relative_path: "textbooks/Linear Algebra/Strang linear algebra/Linear Algebra and its applications fourth edition Strang.pdf"
            title: "Linear Algebra and its applications fourth edition Strang.pdf"
          any_of: ["rank plus nullity equals n"]
      answer:
        any_of: ["nullity", "dimension of the nullspace"]
        all_of: ["pivot", "free", "rank"]

  - id: medium_three_body_game_recruitment
    difficulty: medium
    category: purpose
    query: "Why did the ETO create and distribute its immersive game?"
    expected:
      evidence:
        - source:
            relative_path: "books/cixin_liu/remembrance_of_earths_past/01-the_three_body_problem/the_three_body_problem-cixin_liu.epub"
            title: "The Three-Body Problem"
          all_of: ["to proselytize the Trisolaran religion", "recruit younger ETO members"]
      answer:
        all_of: ["Trisolaran", "recruit"]

  - id: hard_serene_family_trade
    difficulty: hard
    category: relationship
    query: "What craft is Serene learning through work with a parent?"
    expected:
      evidence:
        - source:
            relative_path: "ひと/Serene.md"
            title: "Serene.md"
          any_of: ["works as a jeweler in training with her dad"]
      answer:
        any_of: ["jeweler", "jewelry"]

  - id: hard_nightmare_reason_to_live
    difficulty: hard
    category: relationship
    query: "Which relationship changed how strongly I felt attached to staying alive after the nightmare?"
    expected:
      evidence:
        - source:
            relative_path: "dreams/2025/2025.10.31.md"
            title: "2025.10.31.md"
          any_of: ["Now that I'm with Serene I have greater reason to live"]
      answer:
        any_of: ["Serene"]

  - id: hard_game_montage_nostalgia
    difficulty: hard
    category: relationship
    query: "Who came to mind when the rapidly changing game-character video caused a strong bittersweet reaction?"
    expected:
      evidence:
        - source:
            relative_path: "diary/2025/11 November/2025-Nov-06.md"
            title: "2025-Nov-06.md"
          any_of: ["It makes me think of Mark"]
      answer:
        any_of: ["Mark"]

  - id: hard_uprooted_expected_selection
    difficulty: hard
    category: relationship
    query: "Which girl does Agnieszka's community believe will be chosen when the local wizard next takes someone?"
    expected:
      evidence:
        - source:
            relative_path: "books/naomi_novik/uprooted/uprooted-naomi_novik.epub"
            title: "Uprooted"
          any_of: ["we all knew he would take Kasia"]
      answer:
        any_of: ["Kasia"]

  - id: hard_legendborn_maternal_magic
    difficulty: hard
    category: relationship
    query: "What nature-based magical discipline did Bree learn that her mother had practiced?"
    expected:
      evidence:
        - source:
            relative_path: "books/tracy_deonn/legendborn/01-legendborn/legendborn-tracy_deonn.epub"
            title: "Legendborn"
          all_of: ["Wildcraft is shorthand for the branch of Rootcraft she practiced", "your mother knew the craft"]
      answer:
        any_of: ["Wildcraft", "Rootcraft"]

  - id: hard_scholomance_enclave_text
    difficulty: hard
    category: relationship
    query: "What important written work does El receive, and why is it historically significant to wizard communities?"
    expected:
      evidence:
        - source:
            relative_path: "books/naomi_novik/the_scholomance/01-a_deadly_education/a_deadly_education-naomi_novik.epub"
            title: "A Deadly Education (The Scholomance)"
          all_of: ["The Golden Stone sutras are famous", "the first known enclave-builder spells"]
      answer:
        all_of: ["Golden Stone sutras", "enclave"]

  - id: hard_scholomance_els_mother
    difficulty: hard
    category: relationship
    query: "In the Scholomance trilogy, what is El's mother's name?"
    expected:
      evidence:
        - source:
            relative_path: "books/naomi_novik/the_scholomance/01-a_deadly_education/a_deadly_education-naomi_novik.epub"
            title: "A Deadly Education (The Scholomance)"
          any_of: ["Gwen Higgins is your mother"]
      answer:
